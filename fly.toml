app = "vertexfx"
primary_region = "iad"

[build]

[env]
PORT = "3000"
NODE_ENV = "production"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[mounts]]
source = "vfx_data"
destination = "/app/data"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
