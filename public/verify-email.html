<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify email — VertexFX</title>
<link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/marketing.css">
</head>
<body>
<div class="env-banner"><b>DEMO ENVIRONMENT</b>This environment is provided for demonstration purposes.</div>

<nav class="site-nav">
  <div class="container">
    <a href="/"><img src="/assets/logo-full.svg" class="brand-logo" alt="VertexFX" style="height:22px;"></a>
    <div class="nav-links"></div>
    <div class="nav-cta"><a href="/login.html" class="btn btn-ghost">Log in</a></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card" style="text-align:center;">
    <img src="/assets/logo-mark.svg" class="logo-mark" alt="" style="margin:0 auto 20px;">
    <h1 id="title">Verifying your email…</h1>
    <p class="sub" id="sub">One moment.</p>
    <div class="form-success" id="okBox"></div>
    <div class="form-error" id="errBox"></div>
    <a href="/login.html" class="btn btn-primary btn-block btn-lg" id="loginBtn" style="display:none;margin-top:10px;">Go to login</a>
  </div>
</div>

<script src="/js/vfx-common.js"></script>
<script>
(async ()=>{
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const title = document.getElementById('title');
  const sub = document.getElementById('sub');
  const okBox = document.getElementById('okBox');
  const errBox = document.getElementById('errBox');
  const loginBtn = document.getElementById('loginBtn');
  if(!token){
    title.textContent = 'Missing verification link';
    sub.textContent = 'This page needs a token from your verification email.';
    return;
  }
  try{
    const res = await fetch('/api/auth/verify-email?token='+encodeURIComponent(token));
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Verification failed');
    title.textContent = 'Email verified';
    sub.textContent = 'Your account is now active.';
    okBox.textContent = data.message;
    okBox.style.display='block';
    loginBtn.style.display='flex';
  }catch(err){
    title.textContent = 'Verification failed';
    sub.textContent = '';
    errBox.textContent = err.message;
    errBox.style.display='block';
  }
})();
</script>
</body>
</html>
